<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quicknotes</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>QuickNotes</h1>
        <p>capture ideas before they disappear </p>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </nav>

    </header>
    <main>
        <section>

            <h2>Add a note</h2>
            <form id="note-form">
                <label for="note-input">New note</label>
                <input type="text" id="note-input" placeholder="take a note">
                <br><button type="submit">Add note</button>
            </form>
            <video src="assets/demo.mp4" controls width="180"></video>
            <audio src="assets/demo.mp3" controls></audio>

        </section>

        <section>
            <h2>Your notes</h2>
            <p id="note-count">You have 2 notes</p>
            <ul id="notes-list">
                <li>Revise HTML forms</li>
                <li>Push my code to GitHub</li>
            </ul>
        </section>
    </main>

    <footer>
        <p>&copy;2026 Quicknotes. Built during Web Foundations.</p>
    </footer>

</body>

</html>
